version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_BASEURL=${VITE_BASEURL:-http://localhost:8080}
    ports:
      - "80:80"
    environment:
      - API_URL=${VITE_BASEURL:-http://localhost:8080}
    restart: unless-stopped
    # Se você tiver um serviço backend, pode descomentar as linhas abaixo
    # depends_on:
    #   - backend
  
