spring.application.name=mindrabar-api

spring.jpa.properties.hibernate.hbm2ddl.auto=none
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.defer-datasource-initialization=false
#spring.flyway.enabled=false
spring.flyway.ignore-missing-migrations=true
spring.flyway.validate-on-migrate=false

spring.jpa.open-in-view=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

flyway.url=${spring.datasource.url}
flyway.user=${spring.datasource.username}
flyway.password=${spring.datasource.password}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

spring.rabbitmq.virtual-host=/

rabbitmq.exchange=mindrabar.direct
rabbitmq.routing-key=print