services:
  mindrabar-api:
    build:
      context: ./mindrabar-api
      dockerfile: Dockerfile
    container_name: mindrabar-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - .env

  mindrabar-front:
    build:
      context: ./FrontComanda
      dockerfile: Dockerfile
      args:
        # Esta URL fica gravada no bundle do front no BUILD.
        # \u00c9 o dom\u00ednio p\u00fablico que o Cloudflare Tunnel vai expor pro back.
        VITE_API_URL: https://api-mindrabar.kernel-cloud.online
    container_name: mindrabar-front
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:80"
    depends_on:
      - mindrabar-api
